    paraphrase: Anything discounted at the moment?
  - id: promo-2
    archetype: promotion
    question: Do you have a discount code I can use at checkout?
    paraphrase: Is there a coupon I can punch in when I pay?
  - id: promo-3
    archetype: promotion
