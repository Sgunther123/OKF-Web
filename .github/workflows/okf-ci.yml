name: okf-ci

on:
  push:
    # Every branch except main: main only ever receives a fast-forward of a
    # commit whose check already passed on its branch (CONTRIBUTING.md), so
    # a run there would repeat that run.
    branches-ignore: ["main"]
  pull_request:

# Least privilege (GAPS item 8): the token these jobs get can read the
# repository and nothing else. Actions are pinned to commit SHAs, with the
# version they were pinned at in the comment; bumping one is a deliberate
# edit, never a moving tag.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .[dev]
      - name: Unit tests
        run: pytest -q

  # The required status check for main (CONTRIBUTING.md). It runs the
  # bundle-level checks and reports only after every matrix leg passed,
  # so its name never changes with the Python versions tested.
  test-and-lint:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .[dev]
      - name: Lint example bundle (strict)
        run: okf-web lint bundle-example --strict
      - name: Retrieval coverage (dry-run evaluation)
        run: okf-web evaluate bundle-example --dry-run --min-hit-rate 1.0
      - name: Publish smoke test
        run: okf-web publish bundle-example /tmp/okf-dist
      # The package data proven from a built wheel in a fresh interpreter, not
      # from the editable install above (review 2026-10-21, A-U11): the
      # prompts and the ten packs ship, and the console script runs.
      - name: Wheel smoke test (fresh venv)
        run: |
          python -m build --wheel --outdir /tmp/wheel
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -q /tmp/wheel/*.whl
          /tmp/venv/bin/okf-web lint bundle-example --strict
          /tmp/venv/bin/python -c "from okf_web import packs; assert len(packs.available()) == 10, packs.available().keys()"
          /tmp/venv/bin/python -c "from importlib import resources; assert resources.files('okf_web').joinpath('prompts', 'evaluator_judge.md').is_file()"
