[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okf-web"
version = "0.1.0"
description = "Companion knowledge layer for ecommerce GEO: survey, evaluate, verify, and publish an Open Knowledge Format (OKF v0.2) bundle alongside a storefront."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/Sgunther123/OKF-Web"
"Hosted edition" = "https://www.okf-web.com"

[project.scripts]
okf-web = "okf_web.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
okf_web = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
