name: okf-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev]
      - name: Unit tests
        run: pytest -q

  # The required status check for main (CONTRIBUTING.md). It runs the
  # bundle-level checks and reports only after every matrix leg passed,
  # so its name never changes with the Python versions tested.
  test-and-lint:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .[dev]
      - name: Lint example bundle (strict)
        run: okf-web lint bundle-example --strict
      - name: Retrieval coverage (dry-run evaluation)
        run: okf-web evaluate bundle-example --dry-run --min-hit-rate 1.0
      - name: Publish smoke test
        run: okf-web publish bundle-example /tmp/okf-dist
