# Answerability question set for the Alpine Peak Outfitters bundle.
# Generated by okf-web-evaluator/claude-sonnet-5 on 2026-08-04 and
# curated by human:merch-lead@alpinepeakoutfitters.example (removed 2
# duplicates, added disc-3 as a deliberate out-of-catalog probe).
# `paraphrase` (added with READINESS R3) restates each question in a
# shopper's own words — synonyms, no product names or catalog
# vocabulary — so the paraphrase hit rate measures what customers will
# actually experience, not what curated phrasing flatters.
questions:
  - id: disc-1
    archetype: discovery
    question: Does this store sell a lightweight tent suitable for two people on a summer thru-hike?
    paraphrase: I'm walking a long trail this summer with my partner — got a shelter that won't weigh us down?
  - id: disc-2
    archetype: discovery
    question: I need a down sleeping bag for shoulder-season nights around freezing — do they have one?
    paraphrase: Something warm enough to sleep in when it drops to freezing at night in October?
  - id: disc-3
    archetype: discovery
    question: Do they sell a four-season tent I could use for winter camping in Norway?
    paraphrase: Can I get something here to camp in deep snow and storms in the far north?
  - id: fact-1
    archetype: product_fact
    question: How much does the Alpine 2 tent weigh in my pack?
    paraphrase: How heavy is your two-person shelter once it's strapped to my bag?
  - id: fact-2
    archetype: product_fact
    question: What is the EN limit temperature rating of the Ridgeline 20 sleeping bag?
    paraphrase: How cold can it get before your 20-degree bag stops keeping me warm?
  - id: fact-3
    archetype: product_fact
    question: Is a footprint included with the Alpine 2 tent?
    paraphrase: Does the ground sheet come in the box with the tent or do I buy it separately?
  - id: comp-1
    archetype: comparison
    question: For a tall couple, is the Alpine 2 roomy enough or should we look at something bigger?
    paraphrase: We're both tall — will we fit comfortably or do we need to size up?
  - id: comp-2
    archetype: comparison
    question: What do I give up by choosing a freestanding tent like the Alpine 2 over a trekking-pole shelter?
    paraphrase: What's the downside of a tent with its own poles versus one you pitch with hiking sticks?
  - id: comp-3
    archetype: comparison
    question: Between the regular and long Ridgeline 20, which should a 185 cm tall person buy?
    paraphrase: I'm six foot one — do I take the standard size or the longer one?
  - id: pol-1
    archetype: policy
    question: Can I return the tent after setting it up in my living room to check it?
    paraphrase: If I pitch it indoors once just to look, can I still send it back?
  - id: pol-2
    archetype: policy
    question: How long do I have to return an item, and who pays for return shipping?
    paraphrase: What's the window for sending something back, and is the postage on me?
  - id: pol-3
    archetype: policy
    question: What warranty does the store offer on its own-brand gear?
    paraphrase: If your house-label stuff breaks, how long am I covered?
  - id: ful-1
    archetype: fulfillment
    question: Do they ship to Canada, and what will it cost me?
    paraphrase: I'm in Toronto — can you deliver to me and what's the charge?
  - id: ful-2
    archetype: fulfillment
    question: If I order a tent Tuesday morning, when does it actually ship?
    paraphrase: If I buy early on a weekday, does it go out the same day?
  - id: ful-3
    archetype: fulfillment
    question: Is shipping free for an order over 100 dollars within the US?
    paraphrase: If my cart is over a hundred bucks, do I still pay for delivery?
  - id: tru-1
    archetype: trust
    question: Is this a real company, and how do I reach a human if something goes wrong?
    paraphrase: Are you legit, and who do I talk to if my order gets messed up?
  - id: tru-2
    archetype: trust
    question: What payment methods can I use at checkout?
    paraphrase: Can I pay with PayPal or my phone wallet?
  - id: tru-3
    archetype: trust
    question: Do gift cards from this store expire?
    paraphrase: My voucher is from last year — is it still good?
  - id: cap-1
    archetype: capability
    question: How can my shopping agent get the current price of the Alpine 2 tent programmatically?
