# Publishes okf-web to PyPI when a version tag (v*) is pushed.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token stored in the
# repo. One-time setup on pypi.org: project settings → Publishing →
# add this repository, workflow file name `release.yml`,
# environment `pypi`.
#
# Cutting a release:
#   1. bump `version` in pyproject.toml and `__version__` in
#      src/okf_web/__init__.py (keep them equal)
#   2. git tag v<version> && git push origin v<version>
name: release

on:
  push:
    tags: ["v*"]

# Least privilege (GAPS item 8): read-only by default; only the publish
# job adds the OIDC token PyPI Trusted Publishing needs. Actions are pinned
# to commit SHAs (version in the comment).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Ensure tag matches the package version
        run: |
          pkg_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v${pkg_version}" = "${GITHUB_REF_NAME}" ] || {
            echo "tag ${GITHUB_REF_NAME} != package version v${pkg_version}"; exit 1; }
          mod_version=$(python -c "import sys; sys.path.insert(0, 'src'); import okf_web; print(okf_web.__version__)")
          [ "${pkg_version}" = "${mod_version}" ] || {
            echo "pyproject version ${pkg_version} != okf_web.__version__ ${mod_version}"; exit 1; }
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 head, 2026-09-20
