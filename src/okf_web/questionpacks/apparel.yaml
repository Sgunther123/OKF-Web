# Starter question pack: apparel / fashion.
# Seed for evaluations/questions.yaml — customize the nouns to your
# catalog, then curate: add negative probes your bundle should answer
# with a sourced "no".
questions:
  - {id: disc-1, archetype: discovery, question: "I need a work-appropriate dress I can also wear to dinner — what do you carry?"}
  - {id: disc-2, archetype: discovery, question: "What do you have in sustainable or organic fabrics?"}
  - {id: disc-3, archetype: discovery, question: "Do you carry extended or plus sizes?"}
  - {id: fact-1, archetype: product_fact, question: "What material is your best-selling jacket made of, and how do I wash it?"}
  - {id: fact-2, archetype: product_fact, question: "Does this brand's sizing run small, true, or large?"}
  - {id: fact-3, archetype: product_fact, question: "What inseam lengths do your trousers come in?"}
  - {id: comp-1, archetype: comparison, question: "What's the difference between your slim and tailored fits?"}
  - {id: comp-2, archetype: comparison, question: "Which of your coats is warmer for a real winter?"}
  - {id: comp-3, archetype: comparison, question: "Cotton or merino — which of your base layers lasts longer?"}
  - {id: pol-1, archetype: policy, question: "Can I return something after removing the tags if it doesn't fit?"}
  - {id: pol-2, archetype: policy, question: "How do exchanges for a different size work?"}
  - {id: pol-3, archetype: policy, question: "Are sale items final sale or returnable?"}
  - {id: ful-1, archetype: fulfillment, question: "Do you ship internationally, and who pays customs duties?"}
  - {id: ful-2, archetype: fulfillment, question: "How fast can I get an order if I need it this week?"}
  - {id: ful-3, archetype: fulfillment, question: "Is there a minimum order for free shipping?"}
  - {id: tru-1, archetype: trust, question: "How do I reach a human about an order problem?"}
  - {id: tru-2, archetype: trust, question: "Where are your clothes made?"}
  - {id: tru-3, archetype: trust, question: "What payment methods do you accept, including buy-now-pay-later?"}
  - {id: cap-1, archetype: capability, question: "Can my assistant check the live price of an item through an API?"}
  - {id: cap-2, archetype: capability, question: "Can I check whether a specific size and color is in stock right now?"}
  - {id: cap-3, archetype: capability, question: "Can I look up the status of my order programmatically?"}
  - {id: promo-1, archetype: promotion, question: "Is there a sale on right now?"}
  - {id: promo-2, archetype: promotion, question: "Do you have a discount code for signing up?"}
  - {id: promo-3, archetype: promotion, question: "When does your current promotion end?"}
  - {id: fit-1, archetype: fit_compatibility, question: "I'm 5'10\" and 170 pounds — what size should I order in your shirts?"}
  - {id: fit-2, archetype: fit_compatibility, question: "I'm between a medium and a large in your jackets — which way should I go?"}
  - {id: fit-3, archetype: fit_compatibility, question: "Do your shoes run narrow, and is there a wide option?"}
  - {id: own-1, archetype: ownership, question: "How do I wash this without wrecking the waterproofing?"}
  - {id: own-2, archetype: ownership, question: "A button came off after two months — what are my options?"}
  - {id: own-3, archetype: ownership, question: "Do you repair or re-hem items you sold, and what does it cost?"}
  - {id: pass-1, archetype: compliance, question: "What's the exact fiber composition, and where was it made?"}
  - {id: pass-2, archetype: compliance, question: "Which certifications back your sustainability claims — can I see them?"}
  - {id: pass-3, archetype: compliance, question: "Is this recyclable at end of life, or does it go to landfill?"}
  - {id: loc-1, archetype: local_availability, question: "Where is your nearest store, and does it have fitting rooms?"}
  - {id: loc-2, archetype: local_availability, question: "Can I pick up an online order in store today, and how fast is it ready?"}
  - {id: loc-3, archetype: local_availability, question: "Can I return an online order at the store instead of shipping it back?"}
  - {id: rfq-1, archetype: procurement, question: "Do you wholesale to boutiques, and what's the opening order minimum?"}
  - {id: rfq-2, archetype: procurement, question: "What payment terms do you offer stockists, and how do I apply?"}
  - {id: rfq-3, archetype: procurement, question: "What's the lead time on a bulk order for staff uniforms?"}
